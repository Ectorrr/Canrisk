<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Canrisk</title>
    <link rel="stylesheet" href="../../CSS/register.css">
    <link rel="icon" type="image/png" href="../../MULTIMEDIA/Canrisk LOGO.png">
</head>
<body>
    <div>
        <div class="form">
            <form action="">
            <h1>Create your Canrisk account</h1><br>
            <label class="User-text" for="name">Name:</label><br><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" class="name" required><br><br>
            <label class="User-text" for="usuario">User:</label><br>
            <input type="text" id="usuario" name="usuario" placeholder="Enter your username" class="username" required><br>
            <label class="User-text" for="contraseña">Password:</label><br><br>
            <input type="password" id="contrasena" name="contraseña" placeholder="Enter your password" class="password" required><br>
            <div class="submit-bttn">
                <button type="submit" class="submit-bttn" id="submit-bttn">Create</button>
                <label class="submit-bttn" for="submit" ></label>
            </div>
            <br>
            <button class="regresar" onclick="window.history.back()">Go back</button>
            </form>
        </div>
    </div>

    <script src="../../JS/register.js"></script>
</body>
</html>
